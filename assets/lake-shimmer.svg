<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 320" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.r,.m{animation-name:drift;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.t{animation-name:twinkle;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.mist1{animation:mist 46s ease-in-out infinite alternate}
.mist2{animation:mist 62s ease-in-out infinite alternate-reverse}
.win{animation:flicker 5s ease-in-out infinite}
.sm{animation:smoke 6.6s ease-out infinite;opacity:0}
.cross{animation:glint 6s ease-in-out infinite}
.gon{animation:gondola 52s linear infinite alternate}
.lamp{animation:twinkle ease-in-out infinite}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
@keyframes mist{from{transform:translateX(-50px)}to{transform:translateX(110px)}}
@keyframes flicker{0%,100%{opacity:.85}35%{opacity:.55}60%{opacity:1}80%{opacity:.7}}
@keyframes glint{0%,100%{opacity:.15}50%{opacity:.75}}
@keyframes gondola{to{transform:translate(-92px,94.3px)}}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.5}100%{transform:translate(9px,-30px) scale(2.2);opacity:0}}
</style>
