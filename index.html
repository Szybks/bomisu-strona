<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bomisu.pl — Serwer Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --panel-bg: #1a202c;
    --panel-border: #0f141e;
    --blue: #4f8dff;
    --cyan: #22d3ee;
    --green: #10b981;
    --text: #e8eaf2;
    --muted: #8a92a8;
    
    /* Kolory slotów Minecrafta */
    --slot-bg: #1c1c21;
    --slot-border-light: #111115;
    --slot-border-dark: #3a3a45;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(79,141,255,.15), transparent 50%),
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    color: var(--text);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  /* --- SEKCJA GÓRNA (Hero) --- */
  .hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    flex-grow: 1;
    width: 100%;
    max-width: 800px;
  }

  .hero h1 {
    font-size: clamp(50px, 10vw, 110px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(180deg, #fff 30%, #a8b4d0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 20px;
    text-shadow: 0 4px 20px rgba(79,141,255,0.2);
  }

  .hero p.sub {
    font-size: clamp(16px, 2vw, 20px);
    color: var(--muted);
    max-width: 600px;
    margin-bottom: 40px;
  }

  /* Countdown */
  .countdown {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .cd-box {
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    box-shadow: inset -2px -2px 0px rgba(0,0,0,0.5), inset 2px 2px 0px rgba(255,255,255,0.05);
    border-radius: 6px;
    padding: 14px 18px;
    min-width: 82px;
    text-align: center;
  }

  .cd-num {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    color: var(--cyan);
  }

  .cd-lbl {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    margin-top: 6px;
  }

  .cd-caption {
    width: 100%;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    margin-bottom: 40px;
  }

  /* IP Box */
  .ip-box {
    display: inline-flex;
    align-items: center;
    gap: 20px;
    padding: 16px 24px;
    border-radius: 8px;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    box-shadow: inset -2px -2px 0px rgba(0,0,0,0.5), inset 2px 2px 0px rgba(255,255,255,0.05);
    transition: .2s;
  }

  .ip-box:hover {
    border-color: var(--blue);
  }

  .ip-text {
    text-align: left;
  }

  .ip-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .ip-value {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.5px;
  }

  .copy-btn {
    background: var(--blue);
    border: none;
    color: #fff;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 14px;
    text-transform: uppercase;
    cursor: pointer;
    transition: .1s;
    box-shadow: inset -3px -3px 0px rgba(0,0,0,0.3), inset 3px 3px 0px rgba(255,255,255,0.2);
  }

  .copy-btn:hover {
    filter: brightness(1.1);
  }

  .copy-btn:active {
    box-shadow: inset 3px 3px 0px rgba(0,0,0,0.3), inset -3px -3px 0px rgba(255,255,255,0.2);
    transform: translateY(2px);
  }

  /* --- DOLNA SEKCJA (Hotbar) --- */
  .bottom-bar {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-bottom: 30px;
    margin-top: 50px;
  }

  .hotbar {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 5px; /* Zmniejszony odstęp */
    background-color: var(--panel-bg);
    /* Troszkę cieńsze obramowanie */
    border-top: 4px solid #2d3748;
    border-left: 4px solid #2d3748;
    border-bottom: 4px solid var(--panel-border);
    border-right: 4px solid var(--panel-border);
    padding: 8px;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .slot {
    width: 56px; /* Zmniejszone z 64px */
    height: 56px;
    background-color: var(--slot-bg);
    border-top: 2px solid var(--slot-border-light);
    border-left: 2px solid var(--slot-border-light);
    border-bottom: 2px solid var(--slot-border-dark);
    border-right: 2px solid var(--slot-border-dark);
    transition: background-color 0.1s;
    cursor: pointer;
  }

  .slot:hover {
    background-color: #3a3a45;
  }

  /* Responsywność dla małych ekranów */
  @media (max-width: 600px) {
    .slot {
      width: 34px; /* Na telefonach jeszcze mniejsze */
      height: 34px;
      border-width: 2px;
    }
    .hotbar {
      padding: 6px;
      gap: 3px;
      border-width: 3px;
    }
    .ip-box {
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .ip-text {
      text-align: center;
    }
  }
</style>
</head>
<body>

  <!-- GÓRNA CZĘŚĆ -->
  <header class="hero">
    <h1>BOMISU.PL</h1>
    <p class="sub">Polski serwer Minecraft z unikalnymi trybami. Castle, TNT Tag i wkrótce Flag Hunt. Wbijaj i graj z nami!</p>

    <div class="countdown" id="countdown">
      <div class="cd-box"><div class="cd-num" id="cd-days">0</div><div class="cd-lbl">Dni</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-hours">0</div><div class="cd-lbl">Godzin</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-mins">0</div><div class="cd-lbl">Minut</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-secs">0</div><div class="cd-lbl">Sekund</div></div>
    </div>
    <div class="cd-caption">⏳ Do końca beta testów</div>

    <div class="ip-box">
      <div class="ip-text">
        <div class="ip-label">IP Serwera</div>
        <div class="ip-value" id="ip">bomisu.pl</div>
      </div>
      <button class="copy-btn" onclick="copyIP()" id="copy-btn">Kopiuj IP</button>
    </div>
  </header>

  <!-- DOLNA CZĘŚĆ -->
  <div class="bottom-bar">
    <div class="hotbar">
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
    </div>
  </div>

<script>
  // ====== KOPIUJ IP ======
  function copyIP(){
    const ip = document.getElementById('ip').textContent.trim();
    const btn = document.getElementById('copy-btn');
    
    navigator.clipboard.writeText(ip).then(() => {
      const oldText = btn.textContent;
      btn.textContent = 'Skopiowano!';
      btn.style.background = 'var(--green)';
      
      setTimeout(() => {
        btn.textContent = oldText;
        btn.style.background = 'var(--blue)';
      }, 2000);
    });
  }

  // ====== COUNTDOWN ======
  const betaEnd = new Date(2026, 9, 30, 23, 59, 59); 

  function updateCountdown(){
    const now = new Date().getTime();
    const distance = betaEnd.getTime() - now;
    
    if (distance < 0){
      document.getElementById('countdown').innerHTML = '<div class="cd-caption" style="font-size:20px; color:var(--green);">✅ BETA ZAKOŃCZONA!</div>';
      return;
    }
    
    document.getElementById('cd-days').textContent = Math.floor(distance / (1000 * 60 * 60 * 24));
    document.getElementById('cd-hours').textContent = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    document.getElementById('cd-mins').textContent = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    document.getElementById('cd-secs').textContent = Math.floor((distance % (1000 * 60)) / 1000);
  }
  
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
