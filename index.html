<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bomisu.pl — Serwer Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #07040d;
    --bg-purple: #150b26;
    --panel-bg: #1a202c;
    --panel-border: #0f141e;
    --blue: #4f8dff;
    --green: #10b981;
    --text: #e8eaf2;
    --muted: #8a92a8;
    
    --slot-bg: #1c1c21;
    --slot-border-light: #111115;
    --slot-border-dark: #3a3a45;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg-purple) 0%, var(--bg-void) 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 40px 20px;
    position: relative;
  }

  /* --- KOSMICZNE TŁO Z GWIAZDKAMI --- */
  .space-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    pointer-events: none;
  }

  .stars-small {
    position: absolute; top: 0; left: 0; width: 200%; height: 200%;
    background-image: 
      radial-gradient(1px 1px at 10% 10%, #fff, transparent),
      radial-gradient(1px 1px at 30% 40%, #fff, transparent),
      radial-gradient(1px 1px at 60% 20%, #fff, transparent),
      radial-gradient(1px 1px at 80% 70%, #fff, transparent),
      radial-gradient(1px 1px at 20% 80%, #fff, transparent),
      radial-gradient(1px 1px at 50% 50%, #fff, transparent);
    background-size: 200px 200px;
    animation: drift 60s linear infinite, twinkle 3s infinite alternate;
  }

  .stars-medium {
    position: absolute; top: 0; left: 0; width: 200%; height: 200%;
    background-image: 
      radial-gradient(2px 2px at 40% 10%, #fff, transparent),
      radial-gradient(2px 2px at 70% 40%, #fff, transparent),
      radial-gradient(2px 2px at 15% 60%, #fff, transparent),
      radial-gradient(2px 2px at 90% 90%, #fff, transparent);
    background-size: 300px 300px;
    animation: drift 120s linear infinite, twinkle 5s infinite alternate-reverse;
  }

  .stars-large {
    position: absolute; top: 0; left: 0; width: 200%; height: 200%;
    background-image: 
      radial-gradient(3px 3px at 25% 15%, #fde047, transparent),
      radial-gradient(3px 3px at 75% 65%, #60a5fa, transparent),
      radial-gradient(3px 3px at 50% 85%, #fde047, transparent);
    background-size: 400px 400px;
    animation: drift 180s linear infinite, twinkle 7s infinite alternate;
  }

  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-50%, -50%); } }
  @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 1; } }

  /* --- KSIĘŻYC Z FIZYKĄ --- */
  .moon-container {
    position: fixed;
    top: 0; left: 0; 
    width: 180px; height: 180px;
    cursor: grab;
    z-index: 1;
    touch-action: none; 
    will-change: transform;
  }

  .moon-container:active {
    cursor: grabbing;
  }

  .moon-img {
    width: 100%; height: 100%;
    background-image: url('moon.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 0 25px rgba(186, 230, 253, 0.8)) drop-shadow(0 0 60px rgba(79, 141, 255, 0.5));
    animation: moonGlow 4s infinite alternate;
    will-change: transform;
  }

  /* Uruchamia płynne pływanie dopiero gdy księżyc się zatrzyma */
  .moon-container.idle .moon-img {
    animation: moonGlow 4s infinite alternate, floatAround 6s ease-in-out infinite;
  }

  @keyframes moonGlow {
    0% { filter: drop-shadow(0 0 20px rgba(186, 230, 253, 0.7)) drop-shadow(0 0 40px rgba(79, 141, 255, 0.4)); }
    100% { filter: drop-shadow(0 0 40px rgba(186, 230, 253, 1)) drop-shadow(0 0 80px rgba(79, 141, 255, 0.6)); }
  }

  /* Płynne falowanie (zawsze zaczyna i kończy w 0,0 - brak teleportacji) */
  @keyframes floatAround {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-10px, -22px); }
    100% { transform: translate(0, 0); }
  }

  /* --- EFEKT PODŚWIETLENIA GUI (Aura księżyca) --- */
  .glow-target {
    transition: filter 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
  }

  /* Gdy księżyc jest blisko, elementy dostają niebieską poświatę */
  .glow-target.near-moon {
    filter: drop-shadow(0 0 15px rgba(79, 141, 255, 0.7)) drop-shadow(0 0 30px rgba(147, 197, 253, 0.5));
  }

  /* Specyficzne podświetlenie dla "pudełek" (odliczanie, IP, Hotbar) */
  .cd-box.near-moon, 
  .ip-box.near-moon, 
  .hotbar.near-moon {
    border-color: rgba(147, 197, 253, 0.8);
    box-shadow: 0 0 30px rgba(79, 141, 255, 0.5), inset 0 0 15px rgba(79, 141, 255, 0.2);
  }


  /* --- SEKCJA GÓRNA (Hero) --- */
  .hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    flex-grow: 1;
    width: 100%;
    max-width: 800px;
    margin-top: 20px;
    z-index: 10; 
    pointer-events: none;
  }

  .hero h1, .hero p, .countdown, .ip-box {
    pointer-events: auto;
  }

  .hero h1 {
    font-size: clamp(50px, 10vw, 110px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(90deg, #dbeafe, #60a5fa, #2563eb, #60a5fa, #dbeafe);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textFlow 5s linear infinite;
    margin-bottom: 20px;
    filter: drop-shadow(0 4px 20px rgba(79,141,255,0.2));
  }

  @keyframes textFlow {
    0% { background-position: 0% center; }
    100% { background-position: -200% center; }
  }

  .hero p.sub {
    font-size: clamp(16px, 2vw, 20px);
    color: var(--muted);
    max-width: 600px;
    margin-bottom: 40px;
  }

  /* Countdown */
  .countdown {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .cd-box {
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    box-shadow: inset -2px -2px 0px rgba(0,0,0,0.5), inset 2px 2px 0px rgba(255,255,255,0.05);
    border-radius: 6px;
    padding: 14px 18px;
    min-width: 82px;
    text-align: center;
  }

  .cd-num {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    background: linear-gradient(135deg, #93c5fd, #d8b4fe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }

  .cd-lbl {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    margin-top: 6px;
  }

  .cd-caption {
    width: 100%;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    margin-bottom: 40px;
  }

  /* IP Box */
  .ip-box {
    display: inline-flex;
    align-items: center;
    gap: 20px;
    padding: 16px 24px;
    border-radius: 8px;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    box-shadow: inset -2px -2px 0px rgba(0,0,0,0.5), inset 2px 2px 0px rgba(255,255,255,0.05);
  }

  .ip-text { text-align: left; }
  .ip-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .ip-value { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }

  .copy-btn {
    background: var(--blue);
    border: none;
    color: #fff;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 14px;
    text-transform: uppercase;
    cursor: pointer;
    transition: .1s;
    box-shadow: inset -3px -3px 0px rgba(0,0,0,0.3), inset 3px 3px 0px rgba(255,255,255,0.2);
  }

  .copy-btn:hover { filter: brightness(1.1); }
  .copy-btn:active {
    box-shadow: inset 3px 3px 0px rgba(0,0,0,0.3), inset -3px -3px 0px rgba(255,255,255,0.2);
    transform: translateY(2px);
  }

  /* --- DOLNA SEKCJA (Hotbar) --- */
  .bottom-bar {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-bottom: 20px;
    margin-top: 40px;
    z-index: 10;
  }

  .hotbar {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 5px;
    background-color: var(--panel-bg);
    border-top: 4px solid #2d3748;
    border-left: 4px solid #2d3748;
    border-bottom: 4px solid var(--panel-border);
    border-right: 4px solid var(--panel-border);
    padding: 8px;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .slot {
    width: 56px;
    height: 56px;
    background-color: var(--slot-bg);
    border-top: 2px solid var(--slot-border-light);
    border-left: 2px solid var(--slot-border-light);
    border-bottom: 2px solid var(--slot-border-dark);
    border-right: 2px solid var(--slot-border-dark);
    transition: background-color 0.2s;
    cursor: pointer;
  }

  .slot:hover {
    background-color: #3a3a45;
    box-shadow: inset 0 0 10px rgba(79, 141, 255, 0.5);
  }

  @media (max-width: 600px) {
    .slot { width: 34px; height: 34px; border-width: 2px; }
    .hotbar { padding: 6px; gap: 3px; border-width: 3px; }
    .ip-box { flex-direction: column; gap: 12px; text-align: center; }
    .ip-text { text-align: center; }
    .moon-container { width: 120px; height: 120px; }
  }
</style>
</head>
<body>

  <!-- Tło z gwiazdkami -->
  <div class="space-bg">
    <div class="stars-small"></div>
    <div class="stars-medium"></div>
    <div class="stars-large"></div>
  </div>

  <!-- Księżyc -->
  <div class="moon-container idle" id="moon">
    <div class="moon-img"></div>
  </div>

  <!-- GÓRNA CZĘŚĆ -->
  <header class="hero">
    <h1 class="glow-target" id="main-title">BOMISU.PL</h1>
    <p class="sub glow-target">Polski serwer Minecraft z unikalnymi trybami. Castle, TNT Tag i wkrótce Flag Hunt. Wbijaj i graj z nami!</p>

    <div class="countdown glow-target" id="countdown">
      <div class="cd-box glow-target"><div class="cd-num" id="cd-days">0</div><div class="cd-lbl">Dni</div></div>
      <div class="cd-box glow-target"><div class="cd-num" id="cd-hours">0</div><div class="cd-lbl">Godzin</div></div>
      <div class="cd-box glow-target"><div class="cd-num" id="cd-mins">0</div><div class="cd-lbl">Minut</div></div>
      <div class="cd-box glow-target"><div class="cd-num" id="cd-secs">0</div><div class="cd-lbl">Sekund</div></div>
    </div>
    <div class="cd-caption">⏳ Do końca beta testów</div>

    <div class="ip-box glow-target">
      <div class="ip-text">
        <div class="ip-label">IP Serwera</div>
        <div class="ip-value" id="ip">bomisu.pl</div>
      </div>
      <button class="copy-btn glow-target" onclick="copyIP()" id="copy-btn">Kopiuj IP</button>
    </div>
  </header>

  <!-- DOLNA CZĘŚĆ -->
  <div class="bottom-bar">
    <div class="hotbar glow-target" id="hotbar">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div>
  </div>

<script>
  // ====== FIZYKA KSIĘŻYCA ======
  const moon = document.getElementById('moon');
  let isDragging = false;
  
  // Pozycja startowa
  let posX = window.innerWidth > 600 ? window.innerWidth - 350 : window.innerWidth - 180;
  let posY = 80;
  
  let velX = 0;
  let velY = 0;
  
  const friction = 0.995;
  const bounce = 0.75;    
  const maxSpeed = 22;    

  let offsetX = 0, offsetY = 0;
  let lastMouseX = 0, lastMouseY = 0;

  moon.style.transform = `translate(${posX}px, ${posY}px)`;

  moon.addEventListener('pointerdown', (e) => {
    isDragging = true;
    moon.style.cursor = 'grabbing';
    moon.classList.remove('idle');
    
    const rect = moon.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    
    posX = rect.left;
    posY = rect.top;
    velX = 0;
    velY = 0;
    
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  document.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    
    posX = e.clientX - offsetX;
    posY = e.clientY - offsetY;
    
    const maxX = window.innerWidth - moon.offsetWidth;
    const maxY = window.innerHeight - moon.offsetHeight;
    
    if (posX < 0) posX = 0;
    if (posX > maxX) posX = maxX;
    if (posY < 0) posY = 0;
    if (posY > maxY) posY = maxY;
    
    moon.style.transform = `translate(${posX}px, ${posY}px)`;
    
    velX = (e.clientX - lastMouseX) * 0.8;
    velY = (e.clientY - lastMouseY) * 0.8;
    
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  document.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    moon.style.cursor = 'grab';
    
    if (velX > maxSpeed) velX = maxSpeed;
    if (velX < -maxSpeed) velX = -maxSpeed;
    if (velY > maxSpeed) velY = maxSpeed;
    if (velY < -maxSpeed) velY = -maxSpeed;
    
    if (Math.abs(velX) > 0.5 || Math.abs(velY) > 0.5) {
      requestAnimationFrame(updatePhysics);
    } else {
      moon.classList.add('idle');
    }
  });

  function updatePhysics() {
    if (isDragging) return;
    
    velX *= friction;
    velY *= friction;
    
    posX += velX;
    posY += velY;
    
    const maxX = window.innerWidth - moon.offsetWidth;
    const maxY = window.innerHeight - moon.offsetHeight;
    
    if (posX <= 0) {
      posX = 0;
      velX = Math.abs(velX) * bounce;
    } else if (posX >= maxX) {
      posX = maxX;
      velX = -Math.abs(velX) * bounce;
    }
    
    if (posY <= 0) {
      posY = 0;
      velY = Math.abs(velY) * bounce;
    } else if (posY >= maxY) {
      posY = maxY;
      velY = -Math.abs(velY) * bounce;
    }
    
    moon.style.transform = `translate(${posX}px, ${posY}px)`;
    
    if (Math.abs(velX) > 0.15 || Math.abs(velY) > 0.15) {
      requestAnimationFrame(updatePhysics);
    } else {
      moon.classList.add('idle');
    }
  }

  window.addEventListener('resize', () => {
    const maxX = window.innerWidth - moon.offsetWidth;
    const maxY = window.innerHeight - moon.offsetHeight;
    if (posX > maxX) posX = maxX;
    if (posY > maxY) posY = maxY;
    moon.style.transform = `translate(${posX}px, ${posY}px)`;
  });

  // ====== EFEKT PODŚWIETLENIA (RADAR) ======
  const glowTargets = document.querySelectorAll('.glow-target');
  const glowRadius = 100; // Promień aury (w pikselach). Im większy, tym szybciej zaczyna świecić.

  function checkProximity() {
    // Pobieramy środek księżyca
    const moonRect = moon.getBoundingClientRect();
    const moonCenterX = moonRect.left + moonRect.width / 2;
    const moonCenterY = moonRect.top + moonRect.height / 2;

    glowTargets.forEach(target => {
      const rect = target.getBoundingClientRect();
      
      // Znajdujemy najbliższy punkt na elemencie GUI względem środka księżyca
      const closestX = Math.max(rect.left, Math.min(moonCenterX, rect.right));
      const closestY = Math.max(rect.top, Math.min(moonCenterY, rect.bottom));
      
      // Obliczamy dystans
      const distance = Math.hypot(moonCenterX - closestX, moonCenterY - closestY);

      // Jeśli księżyc jest bliżej niż glowRadius, dodajemy klasę
      if (distance < glowRadius) {
        target.classList.add('near-moon');
      } else {
        target.classList.remove('near-moon');
      }
    });

    // Pętla sprawdza to bez przerwy
    requestAnimationFrame(checkProximity);
  }

  // Uruchomienie radaru
  requestAnimationFrame(checkProximity);

  // ====== KOPIUJ IP ======
  function copyIP(){
    const ip = document.getElementById('ip').textContent.trim();
    const btn = document.getElementById('copy-btn');
    
    navigator.clipboard.writeText(ip).then(() => {
      const oldText = btn.textContent;
      btn.textContent = 'Skopiowano!';
      btn.style.background = 'var(--green)';
      
      setTimeout(() => {
        btn.textContent = oldText;
        btn.style.background = 'var(--blue)';
      }, 2000);
    });
  }

  // ====== COUNTDOWN ======
  const betaEnd = new Date(2026, 9, 30, 23, 59, 59); 

  function updateCountdown(){
    const now = new Date().getTime();
    const distance = betaEnd.getTime() - now;
    
    if (distance < 0){
      document.getElementById('countdown').innerHTML = '<div class="cd-caption" style="font-size:20px; color:var(--green);">✅ BETA ZAKOŃCZONA!</div>';
      return;
    }
    
    document.getElementById('cd-days').textContent = Math.floor(distance / (1000 * 60 * 60 * 24));
    document.getElementById('cd-hours').textContent = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    document.getElementById('cd-mins').textContent = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    document.getElementById('cd-secs').textContent = Math.floor((distance % (1000 * 60)) / 1000);
  }
  
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
